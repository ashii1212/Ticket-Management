spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/edumerge_support}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    secret: ${JWT_SECRET:edumerge-secret-key-for-development-only-change-in-production-min-256-bits}
    expiry-hours: 24
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
