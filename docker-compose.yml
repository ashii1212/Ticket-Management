version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: edumerge-postgres
    environment:
      POSTGRES_DB: edumerge_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edumerge-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/edumerge_support
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: edumerge-jwt-secret-change-in-production-must-be-256-bits-long
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edumerge-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
